---
name: Terraform

on:
  pull_request:
    paths:
      - terraform/hetzner/**
      - .github/workflows/terraform.yaml
  push:
    branches:
      - main
    paths:
      - terraform/hetzner/**
      - .github/workflows/terraform.yaml
  workflow_dispatch:
    inputs:
      tier:
        description: Tier, the Terraform workspace.
        type: choice
        options:
          - test
          - prod
      action:
        description: Terraform action; destroy only on test.
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  # Addresses are private
  MASK_IPS: 's/\b[1-9][0-9]{0,2}(\.[0-9]{1,3}){3}\b/<ipv4>/g; s/\b[0-9a-f]{1,4}(:[0-9a-f]{0,4}){2,7}(\/[0-9]+)?/<ipv6>/gi'

jobs:
  plan:
    name: Plan (${{ matrix.tier }})
    strategy:
      fail-fast: false
      matrix:
        tier: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '["test","prod"]'
          || github.event_name == 'push' && '["prod"]'
          || format('["{0}"]', inputs.tier)) }}
    environment: ${{ matrix.tier }}-plan
    runs-on: ubuntu-slim
    env:
      TF_WORKSPACE: ${{ matrix.tier }}
      ACTION: ${{ inputs.action || 'apply' }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_BUCKET: ${{ vars.AWS_TF_BUCKET }}
      AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 }}
    steps:
      - name: Refuse prod destroy
        if: matrix.tier == 'prod' && inputs.action == 'destroy'
        run: exit 1
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Terraform init
        run: terraform -chdir=terraform/hetzner init -backend-config="bucket=$AWS_BUCKET"
      - name: Terraform plan
        run: |
          args=(plan -lock=false -no-color -var-file="$TF_WORKSPACE.tfvars")
          if [[ "$ACTION" == destroy ]]; then
            args+=(-destroy)
          fi
          terraform -chdir=terraform/hetzner "${args[@]}" 2>&1 | sed -E "$MASK_IPS" | tee "$RUNNER_TEMP/plan.txt"
          {
            echo "## Terraform plan ($TF_WORKSPACE, $ACTION)"
            grep -m1 -E '^(Plan:|No changes\.)' "$RUNNER_TEMP/plan.txt" || true
            echo '```text'
            cat "$RUNNER_TEMP/plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply
    needs: plan
    if: github.event_name != 'pull_request'
    environment: ${{ github.event_name == 'push' && 'prod' || inputs.tier }}
    runs-on: ubuntu-slim
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'prod' || inputs.tier }}
      cancel-in-progress: false
    env:
      TF_WORKSPACE: ${{ github.event_name == 'push' && 'prod' || inputs.tier }}
      ACTION: ${{ inputs.action || 'apply' }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_BUCKET: ${{ vars.AWS_TF_BUCKET }}
      AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Terraform init
        run: terraform -chdir=terraform/hetzner init -backend-config="bucket=$AWS_BUCKET"
      - name: Terraform ${{ inputs.action || 'apply' }}
        run: terraform -chdir=terraform/hetzner "$ACTION" -auto-approve -no-color -var-file="$TF_WORKSPACE.tfvars" 2>&1 | sed -E "$MASK_IPS"
