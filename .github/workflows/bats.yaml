---
name: BATS

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - name: Detect BATS inputs
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          run=false
          grep -qE '^(claude/|\.github/workflows/bats\.yaml$)' <<<"$files" && run=true
          echo "run=$run" >>"$GITHUB_OUTPUT"

  bats:
    name: BATS
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install BATS
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats bats-assert bats-support git jq
      - name: Run BATS
        run: bats claude

  required:
    name: Required (BATS)
    needs: [gate, bats]
    if: always()
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
