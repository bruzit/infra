---
name: Terraform Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Terraform Test
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Terraform init
        run: terraform -chdir=terraform/hetzner init -backend=false
      - name: Terraform validate
        run: terraform -chdir=terraform/hetzner validate
      - name: Terraform test
        run: terraform -chdir=terraform/hetzner test
      - name: Terraform init Cloudflare
        run: terraform -chdir=terraform/cloudflare init -backend=false
      - name: Terraform test Cloudflare
        run: terraform -chdir=terraform/cloudflare test

  required:
    name: Required (Terraform Test)
    needs: [test]
    if: always()
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
