---
all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
    # Ubuntu >= 25.10 defaults to sudo-rs, whose prompt format breaks Ansible become detection
    ansible_become_exe: "{{ '/usr/bin/sudo.ws' if ansible_facts.distribution_version | default('0') is version('25.10', '>=') else 'sudo' }}"
  children:
    workstations:
      hosts:
        pc0:
        pc2:
        pc4:
    media:
      hosts:
        pc1:
        pc3:
    wsl:
      hosts:
        wsl-beta:
          ansible_connection: local
    # Hosts come from the hcloud.yaml inventory
    cloud:
      vars:
        ansible_user: mb
        # Recreated servers get fresh host keys
        ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new
