---
claude_settings:
  extraKnownMarketplaces:
    claude-plugins-official:
      source:
        source: github
        repo: anthropics/claude-plugins-official
  enabledPlugins:
    superpowers@claude-plugins-official: true
    mattpocock-skills@claude-plugins-official: true
  attribution:
    commit: ""
    pr: ""
  permissions:
    deny:
      - Read(//**/.obsidian/plugins/remotely-save/data.json)
      - Read(//**/.env)
      - Read(//**/.env.apply)
      - Read(//**/.env.plan)
      - Read(//**/.env.*.apply)
      - Read(//**/.env.*.plan)
      - Read(//**/*.pem)
